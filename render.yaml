# ============================================================================
# SAFEX AI — Render blueprint
#
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repo.
# ============================================================================
services:
  - type: web
    name: safex-ai
    runtime: python
    plan: standard          # 2 GB RAM. See the note at the bottom of this file.
    region: oregon          # change to frankfurt / singapore / ohio as needed
    branch: main

    buildCommand: "chmod +x build.sh && ./build.sh"

    # One worker only. Each worker loads its own copy of both YOLO models, so a
    # second worker doubles memory for no throughput gain on a 1-vCPU plan.
    # $PORT is injected by Render; binding 0.0.0.0 is required or the health
    # check can never reach the service.
    startCommand: >-
      uvicorn server:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --timeout-keep-alive 65
      --no-access-log

    healthCheckPath: /healthz

    envVars:
      # ── SPEED ────────────────────────────────────────────────────────────
      # Set to "1" for the low-latency profile: smaller letterboxes, single
      # confirmation frame, people detection every frame. Roughly 3x faster to
      # first detection, at some cost in detection quality on hard frames.
      # The skin veto and FIRE_STRONG_CONF are NOT relaxed by this.
      - key: FAST_MODE
        value: "1"

      - key: PYTHON_VERSION
        value: "3.11.9"

      # Keep Ultralytics and matplotlib caches on a writable path.
      - key: YOLO_CONFIG_DIR
        value: /tmp/ultralytics
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib

      # Small instances: extra BLAS/OpenMP threads cause contention, not speed.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TORCH_THREADS
        value: "1"

      # Inference tuning — benchmarked on 1 vCPU:
      #   fire @416 ≈ 55 ms, people @320 ≈ 43 ms
      - key: FIRE_IMGSZ
        value: "416"
      - key: PEOPLE_IMGSZ
        value: "320"
      - key: DETECT_STRIDE
        value: "2"
      - key: MAX_CONCURRENT_INFERENCE
        value: "2"

      - key: WARMUP_ON_START
        value: "1"
      - key: SESSION_TTL_SECONDS
        value: "90"

      # ── Detection reliability ────────────────────────────────────────────
      # Declared here (not just defaulted in config.py) so they can be edited
      # from the Render dashboard and applied with a restart — no redeploy.
      #
      # Live tuning, in order of usefulness:
      #   fire not detecting  -> FIRE_COLOUR_STANDALONE_RATIO   0.018 -> 0.012
      #                       -> FIRE_COLOUR_STANDALONE_FLICKER 0.28  -> 0.20
      #   false alarms        -> FIRE_CONFIRM_FRAMES            2     -> 3
      #   badge flickering    -> FIRE_HOLD_FRAMES               12    -> 18
      #   full rollback       -> FIRE_FUSION_ENABLED=0, FIRE_CONFIRM_FRAMES=1,
      #                          FIRE_HOLD_FRAMES=0
      - key: FIRE_FUSION_ENABLED
        value: "1"
      - key: FIRE_STRONG_CONF
        value: "0.72"
      - key: FIRE_SKIN_VETO_RATIO
        value: "0.22"
      - key: FIRE_SKIN_VETO_FLICKER
        value: "0.30"
      - key: FIRE_COLOUR_OVERWHELMING_RATIO
        value: "0.09"
      - key: FIRE_COLOUR_OVERWHELMING_FLICKER
        value: "0.08"
      - key: FIRE_COLOUR_STANDALONE_RATIO
        value: "0.015"
      - key: FIRE_COLOUR_STANDALONE_FLICKER
        value: "0.25"
      - key: FIRE_CONFIRM_FRAMES
        value: "2"
      - key: FIRE_HOLD_FRAMES
        value: "12"
      - key: SMOKE_CONFIRM_FRAMES
        value: "3"
      - key: SMOKE_HOLD_FRAMES
        value: "10"
      - key: BOX_SMOOTHING_ALPHA
        value: "0.45"

      # Let cameras in the same session watch each other. Set to 0 for
      # counts-only fusion with no video relay.
      - key: REMOTE_VIEW_ENABLED
        value: "1"
      - key: LOG_LEVEL
        value: "INFO"

      # Lock this down to your own domain once the service is public.
      - key: ALLOWED_ORIGINS
        value: "*"

# ---------------------------------------------------------------------------
# Plan sizing
#
# CPU-only torch plus both YOLOv8n networks settles around 400–500 MB resident
# once warmed. The 512 MB tiers (free / starter) sit right on that line and will
# be OOM-killed under any real load, so `standard` (2 GB) is the smallest plan
# that behaves. If you must run on 512 MB: set WARMUP_ON_START=0, drop
# FIRE_IMGSZ to 320, and expect the first request after a cold start to take
# 20–40 s while the weights load.
#
# The free tier also spins down after inactivity — the first visitor then waits
# out a cold boot before the camera stream produces anything.
# ---------------------------------------------------------------------------
